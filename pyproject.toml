[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-scheduled-queue"
version = "0.3.5"
description = "Persist, pause, reorder, and time-deliver ComfyUI prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "27-exe" }]
keywords = ["comfyui", "scheduler", "queue", "batch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/27-exe/ComfyUI-ScheduledQueue"
Issues = "https://github.com/27-exe/ComfyUI-ScheduledQueue/issues"

# No [tool.setuptools] packages — the package is meant to be installed
# by ComfyUI's loader, not pip. The custom_node root is the directory
# itself, so an `editable` install would point at this same tree.
